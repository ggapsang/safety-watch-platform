services:
  trash-detector:
    build: .
    image: daim/trash-detector:0.1.0
    container_name: trash-detector
    restart: unless-stopped

    # 대시보드: 호스트 ${DASHBOARD_PUBLISH_PORT} -> 컨테이너 8080
    # (카메라 RTSP·PLC 로의 아웃바운드는 bridge 에서도 NAT 로 정상 동작한다.
    #  리눅스 산업용 PC 에서 host 네트워크가 필요하면 docker-compose.host.yml 을 덧붙일 것.)
    ports:
      - "${DASHBOARD_PUBLISH_PORT:-1235}:8080"

    env_file:
      - .env

    # env_file 보다 우선한다 — 컨테이너 내부 포트는 항상 8080 으로 고정.
    environment:
      DASHBOARD_HOST: "0.0.0.0"
      DASHBOARD_PORT: "8080"
      RUNTIME_CONFIG_PATH: "/app/runtime/settings.json"
      RECORDINGS_DIR: "/app/recordings"

    volumes:
      - ./model_files:/app/model_files:ro
      # 대시보드에서 저장한 설정 — 컨테이너 재시작 후에도 유지
      - ./runtime:/app/runtime
      # 녹화 mp4 — 호스트에서도 바로 열 수 있다
      - ./recordings:/app/recordings

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
