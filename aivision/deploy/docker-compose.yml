# AI Vision 통합관제 플랫폼 — 운영 스택
#
# 서비스 이름은 '없으면 플랫폼이 안 도는 것'과 '있어도 되고 없어도 되는 것'으로 가른다.
# 목록만 보고도 무엇을 꺼도 되는지 알 수 있어야 하기 때문이다.
#
#   base-*   기본으로 항상 뜬다. 이것들이 없으면 플랫폼이 서지 않는다.
#   mod-*    분석 모듈. profile 로 켠다. 꺼도 플랫폼은 그대로 돈다.
#
#   [카메라] --RTSP--> [base-media] --+--> [base-app] --MJPEG--> [브라우저]
#                                     +--> [mod-*] (RTSP · 메타데이터)
#                                     +--> 디스크 (녹화)
#
#   [카메라] --MQTT--> [base-broker] <--> [base-app] <--> [base-db]
#        [mod-*] --MQTT--^                    ^
#                                    [브라우저] --WebSocket/REST
#
# 사용: docker compose -f deploy/docker-compose.yml up -d --build
#      base-* 도 mod-* 도 전부 뜬다. 모듈을 쓰지 않으려면 stop 하면 된다 —
#      기본으로 꺼 두면 클론한 쪽에서 '기능이 없다' 로 보인다.
name: aivision

services:
  base-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aivision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aivision}
      POSTGRES_DB: ${POSTGRES_DB:-aivision}
      # 한국어 정렬·시간대
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aivision} -d ${POSTGRES_DB:-aivision}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      # 분석·점검 도구(psql, DBeaver 등)로 직접 붙을 수 있게 열어 둔다.
      # 주의: 열려 있는 만큼 POSTGRES_PASSWORD 를 기본값으로 두면 안 된다.
      - "${POSTGRES_PORT:-11882}:5432"

  base-broker:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      # MQTT TCP 는 표준 포트(1883)를 그대로 쓴다. 카메라의 기본값이 1883 이라,
      # 여기를 옮기면 현장 카메라마다 설정을 바꿔야 한다. 포트 충돌은 이 PC 안의 문제일 뿐이고
      # 컨테이너 안쪽은 어차피 1883 이므로, 호스트에서 1883 을 비워 두는 편이 낫다.
      # (웹소켓 9001 은 브라우저만 쓰고 설정 지점이 .env 한 곳이라 11881 로 옮겼다.)
      - "${MQTT_TCP_PORT:-1883}:1883"     # 카메라 → 브로커 (MQTT over TCP)
      - "${MQTT_WS_PORT:-11881}:9001"     # 브라우저 → 브로커 (WebSocket, 'MQTT 로그' 화면)
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/#' -C 1 -W 3 -q 0 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 6s
      retries: 3

  base-media:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
    ports:
      # 분석 모듈이 영상을 가져가는 곳. 카메라가 아니라 여기로 붙어야 카메라 부하가 늘지 않는다.
      - "${RTSP_PORT:-8554}:8554"
      # 브라우저용 WebRTC/HLS. 지금은 MJPEG 을 쓰지만 배선은 열어 둔다.
      - "${WEBRTC_PORT:-11884}:8889"
      - "${HLS_PORT:-11885}:8888"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      # 녹화를 어디에 쌓을지. 기본은 도커 볼륨이고, .env 의 RECORD_PATH 에 호스트 경로를
      # 적으면(예: D:/aivision-recordings) 그 폴더에 쌓인다. 큰 디스크로 옮길 때 쓴다.
      # 컨테이너 안쪽 경로(/recordings)는 바뀌지 않는다 — 바뀌는 것은 '무엇을 붙이나' 다.
      - ${RECORD_PATH:-recordings}:/recordings
    # 헬스체크를 두지 않는다. 이 이미지는 셸도 wget 도 없는 최소 이미지라
    # CMD-SHELL 이 아예 실행되지 않고 영원히 unhealthy 로 남는다(잘못된 경보).
    # 미디어 서버 상태는 서버가 Control API 로 확인해 /api/system 에 보여 준다.

  base-app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      base-db:
        condition: service_healthy
      base-broker:
        condition: service_started
      base-media:
        condition: service_started
    environment:
      TZ: ${TZ:-Asia/Seoul}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aivision}:${POSTGRES_PASSWORD:-aivision}@base-db:5432/${POSTGRES_DB:-aivision}
      # 서버는 컨테이너 네트워크 안에서 붙으므로 항상 표준 포트다.
      # (위 ports: 의 호스트 포트는 '바깥에서 보이는 주소'일 뿐 여기와 무관하다.)
      MQTT_HOST: base-broker
      MQTT_PORT: "1883"
      # 브라우저가 직접 붙을 브로커 주소 — 컨테이너 내부 이름이 아니라 '호스트에서 보이는 주소'여야 한다.
      MQTT_WS_URL: ${MQTT_WS_URL:-ws://localhost:11881}
      # 미디어 평면. direct 로 바꾸면 미디어 서버 없이 카메라에 직접 붙는다(fan-out·녹화 없음).
      MEDIA_BACKEND: ${MEDIA_BACKEND:-mediamtx}
      MEDIAMTX_API_URL: http://base-media:9997
      MEDIAMTX_PLAYBACK_URL: http://base-media:9996
      MEDIAMTX_RTSP_HOST: base-media:8554
      # 브라우저가 닿는 주소 — 컨테이너 이름이 아니라 밖에서 보이는 주소여야 한다.
      MEDIAMTX_PUBLIC_URL: ${MEDIAMTX_PUBLIC_URL:-http://localhost:11884}
      # 예전에 카메라 비밀번호를 암호화하던 키. 이제 평문으로 두므로 필요 없다.
      # 옛 암호문을 푸는 마이그레이션(3864ed7c06b2)에만 쓰이므로, 한 번 올린 뒤에는
      # .env 에서 지워도 된다. 새로 설치하는 곳에서는 처음부터 없어도 된다.
      SECRET_KEY: ${SECRET_KEY:-}
      SNAPSHOT_DIR: /data/snapshots
      # 이벤트 클립은 코어 자산이라 우리 볼륨에 둔다(미디어 서버 세그먼트 회전과 무관).
      CLIP_DIR: /data/clips
      # 상시 녹화 폴더. 파일을 쓰는 것은 미디어 서버지만, '용량이 얼마나 찼나'와
      # '넘치면 무엇부터 버리나'는 정책이라 코어가 본다. 미디어 서버는 시간 기반
      # 회전(recordDeleteAfter)만 할 수 있어 용량 상한은 여기서 지킨다.
      RECORD_DIR: /recordings
      # 같은 메시지(토픽+페이로드 동일)를 이 간격 안에서는 한 번만 처리한다. 0 이면 끔.
      # 중복 억제(20초, DB 로 판단)와는 층이 다르다 — 이건 문 앞에서 메모리로 막는다.
      INBOUND_MIN_INTERVAL_SEC: ${INBOUND_MIN_INTERVAL_SEC:-1}
      # 전체 용량 상한(GB). 0 이면 제한 없음. 관리자 화면에서 덮어쓸 수 있다.
      RECORD_MAX_GB: ${RECORD_MAX_GB:-0}
      # 위 마운트의 '호스트 쪽' 이름. 화면에 '지금 어디에 쌓이는가' 를 보여 주는 용도일 뿐
      # 서버는 이 값으로 아무것도 하지 않는다(컨테이너 안에서는 늘 /recordings 다).
      RECORD_LOCATION: ${RECORD_PATH:-recordings}
      # 커밋할 수 있는 설정(탐지 항목·바인딩·운영 설정)의 원본. 기동할 때 DB 로 붓고,
      # 화면에서 고친 뒤에는 /api/config/save 로 여기에 되쓴다. DB 는 이벤트가 쌓여
      # GB 로 커지므로 저장소에 올릴 수 없다 — 그래서 설정만 파일로 따로 뺀다.
      CONFIG_FILE: /config/platform.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${HTTP_PORT:-11880}:8000"
    volumes:
      - media-data:/data
      # 저장소 안의 설정 파일을 그대로 본다. 읽기 전용이 아닌 이유는 화면에서
      # 고친 배선을 여기에 되써야 하기 때문이다(그 뒤 git 으로 커밋한다).
      - ./config:/config
      # 미디어 서버와 같은 것을 본다. 쓰는 쪽은 미디어 서버 하나뿐이고
      # 코어는 용량을 재고 넘칠 때 오래된 것을 지우기 위해 붙는다.
      - ${RECORD_PATH:-recordings}:/recordings
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health').read()"]
      interval: 20s
      timeout: 5s
      retries: 5

  # 서버 YOLO 모듈 — 학습과 추론, 그리고 자기 화면(11990).
  #
  # 코어가 아니라 별도 컨테이너인 이유: torch·onnxruntime·opencv 로 이미지가 GB 단위로
  # 불어나고, 학습이나 추론이 죽을 때 웹서버가 같이 죽어서는 안 되며, 모델 로딩이 서버
  # 기동을 붙잡아서도 안 된다. 그리고 이 모듈은 모듈 계약의 사용자여야 한다 —
  # 코어 안에 두면 계약을 우회하는 특별 통로가 생긴다(매니페스토 1번).
  #
  # 이 모듈만 화면을 갖는 이유: 사람이 할 일이 있다(데이터셋 선택·학습·모델 채택).
  # 그 화면을 플랫폼에 넣으면 코어가 YOLO 를 알게 되므로(매니페스토 2번) 모듈이 직접
  # 띄우고, 플랫폼은 등록된 endpoint 를 탭으로 감싸기만 한다.
  #
  # 기본으로 뜬다. 모델이 없으면 dry-run 으로 내려앉고 학습 화면(11990)만 쓴다 —
  # 꺼 두면 클론한 쪽에서 '모듈이 없다' 로 보인다. 쓰지 않으려면 stop 하면 된다.
  #
  # GPU 로 학습하려면 CUDA 판 torch 로 빌드하고 아래 deploy 블록의 주석을 푼다.
  #   docker compose build --build-arg TORCH_INDEX=https://download.pytorch.org/whl/cu121 mod-yolo
  mod-yolo:
    build:
      # 컨텍스트가 modules/ 인 이유: 모듈들이 공유하는 _sdk 를 같이 담아야 한다.
      context: ../modules
      dockerfile: yolo/Dockerfile
      args:
        # 기본은 CPU 판이라 어디서든 빌드된다. 학습에는 CUDA 판이 필요하다.
        TORCH_INDEX: ${YOLO_TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
    ports:
      # 모듈 자기 화면·API. 플랫폼 탭이 이 주소를 감싼다.
      - "${YOLO_UI_PORT:-11990}:8000"
    restart: unless-stopped
    depends_on:
      base-app:
        condition: service_started
      base-broker:
        condition: service_started
      base-media:
        condition: service_started
    environment:
      TZ: ${TZ:-Asia/Seoul}
      # 컨테이너 네트워크 안에서 붙는다. 원격 PC 에서 돌릴 때는 호스트 주소로 바꾼다.
      PLATFORM_URL: http://base-app:8000
      MQTT_HOST: base-broker
      MQTT_PORT: "1883"
      MODULE_ID: ${YOLO_MODULE_ID:-yolo-server}
      MODULE_NAME: ${YOLO_MODULE_NAME:-객체감지}
      # 모델 파일 경로(컨테이너 안). 없으면 모듈이 dry-run 으로 내려앉는다.
      MODEL_PATH: ${YOLO_MODEL_PATH:-/models/best.onnx}
      # 모델 클래스 -> 플랫폼 탐지 항목 코드. 모델이 바뀌면 이것만 바꾼다.
      # 예: {"no_helmet":"ITEM-001","no_vest":"ITEM-002"}  (항목을 먼저 만들어 두세요)
      # (compose 는 기본값 안의 중괄호를 제대로 못 읽으므로 기본값은 비워 둔다.)
      CLASS_MAP: ${YOLO_CLASS_MAP:-}
      DEVICE: ${YOLO_DEVICE:-cpu}
      IMGSZ: ${YOLO_IMGSZ:-640}
      CONF_THRES: ${YOLO_CONF_THRES:-0.25}
      IOU_THRES: ${YOLO_IOU_THRES:-0.45}
      # 출력 텐서 해석. auto 가 틀리는 모델을 만나면 v5 / v8 / nms 로 못 박는다.
      LAYOUT: ${YOLO_LAYOUT:-auto}
      SAMPLE_FPS: ${YOLO_SAMPLE_FPS:-3}
      HOLD_SEC: ${YOLO_HOLD_SEC:-3}
      MIN_CONF: ${YOLO_MIN_CONF:-0.4}
      # 이 크기(sqrt(w*h) 픽셀)보다 작은 박스는 버린다. 0 이면 안 버린다.
      # 라벨에서 지우는 것보다 여기서 거르는 편이 낫다(사내 실험 기록 — config.py 주석).
      MIN_BOX_PX: ${YOLO_MIN_BOX_PX:-0}
      DRY_RUN: ${YOLO_DRY_RUN:-false}
      # 브라우저가 닿는 주소. 플랫폼이 이 주소를 탭으로 감싼다.
      # 다른 PC 에서 접속시킬 거라면 localhost 대신 서버 PC 의 IP 를 넣어야 한다.
      PUBLIC_URL: ${YOLO_PUBLIC_URL:-http://localhost:11990}
      # 학습에 쓸 장치. GPU 번호 또는 cpu. CPU 로는 현실적으로 학습이 안 된다.
      TRAIN_DEVICE: ${YOLO_TRAIN_DEVICE:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # 모델과 사전학습 가중치. 학습 결과를 여기에 쓰므로 읽기 전용이 아니다.
      - ../models:/models
      # 학습 산출물과 데이터셋. 수십 GB 가 될 수 있어 볼륨으로 둔다.
      - training:/training
    # GPU 학습을 쓸 때 주석을 푼다. Docker Desktop 은 WSL2 GPU 지원이 켜져 있어야 한다.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # 카메라 ONVIF 메타데이터 -> 라이브 박스.
  #
  # 우리가 추론하지 않는다. 카메라 안에서 이미 돌고 있는 분석이 만든 박스를 RTSP
  # 메타데이터 트랙에서 읽어 화면에만 그린다. **이벤트를 만들지 않는다** —
  # 사람이 서 있는 동안 초당 여러 번 나오는 판독을 이벤트로 쌓으면 DB 가 무너진다.
  mod-camera-meta:
    build:
      # 컨텍스트가 modules/ 인 이유: 모듈들이 공유하는 _sdk 를 같이 담아야 한다.
      context: ../modules
      dockerfile: onvif_meta/Dockerfile
    restart: unless-stopped
    depends_on:
      base-app:
        condition: service_started
      base-broker:
        condition: service_started
      base-media:
        condition: service_started
    environment:
      TZ: ${TZ:-Asia/Seoul}
      PLATFORM_URL: http://base-app:8000
      MQTT_HOST: base-broker
      MQTT_PORT: "1883"
      MODULE_ID: ${META_MODULE_ID:-camera-meta}
      MODULE_NAME: ${META_MODULE_NAME:-카메라 메타데이터}
      # 카메라 클래스 이름 -> 화면에 쓸 이름. 비우면 원래 이름(Human, Face 등) 그대로.
      # 예: {"Human":"사람","Face":"얼굴","Vehicle":"차량"}
      CLASS_MAP: ${META_CLASS_MAP:-}
      # 표에 없는 클래스도 그릴지. 무엇이 잡히는지 보려면 켜 두는 편이 낫다.
      KEEP_UNMAPPED: ${META_KEEP_UNMAPPED:-true}
      # 그리지 않을 클래스. 사람 하나에 Human·Head·Face 가 겹쳐 나와 박스가 세 겹이 된다.
      SKIP_CLASSES: ${META_SKIP_CLASSES:-Head,Face}
      # 라이브 발행 최소 간격(초). 브라우저가 감당할 수준으로 눌러 준다.
      LIVE_MIN_INTERVAL: ${META_LIVE_MIN_INTERVAL:-0.2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

# 볼륨 이름은 서비스 이름을 따라 바꾸지 않는다. 볼륨은 이름으로 찾으므로, 바꾸는 순간
# 새 빈 볼륨이 생기고 기존 DB·녹화가 통째로 사라진다. 이름이 옛 서비스명을 닮은 것은
# 그 대가에 비하면 사소하다.
volumes:
  db-data:
  training:        # 학습 산출물·데이터셋 (mod-yolo). 수십 GB 가 될 수 있다         # PostgreSQL 데이터 (base-db)
  recordings:      # 미디어 서버의 상시 녹화 세그먼트 — 회전 삭제됨 (base-media)
  media-data:      # 플랫폼 자산 — 스냅샷과 이벤트 클립, 오래 보관 (base-app)
  mqtt-data:       # 브로커 영속 세션 (base-broker)
  mqtt-log:        # 브로커 로그 (base-broker)
