# Mosquitto 2.x — AI Vision 통합관제
# 카메라(ONVIF 이벤트 발행)와 브라우저(MQTT 로그 화면)를 같은 브로커에 붙인다.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp true

# ── 카메라·서버용 TCP 리스너 ──────────────────────────────────────────────
listener 1883 0.0.0.0
protocol mqtt

# ── 브라우저용 WebSocket 리스너 ──────────────────────────────────────────
# 'MQTT 로그' 화면이 브로커에 직결 구독한다(서버 경유 없음 — 원문 페이로드 무손상 확인용).
listener 9001 0.0.0.0
protocol websockets

# 주의: 폐쇄망 현장 기준으로 익명 접속을 허용한다.
#   외부에 노출되는 망이라면 allow_anonymous false 로 바꾸고 아래 password_file 을 사용할 것.
allow_anonymous true
# password_file /mosquitto/config/passwd

max_keepalive 120
message_size_limit 1048576
